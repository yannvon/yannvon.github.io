<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Validator Anonymity</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }

  /* Tokens: the Devcon palette on flat cream pages; Poppins + Roboto Condensed, as in the Mumbai decks. */
  :root {
    --paper: #FAF7F3;
    --ink: #36364C;
    --title: #06038D;
    --muted: #6E6C80;
    --teal-ink: #00796A;
    --sans: "Poppins", "Avenir Next", system-ui, sans-serif;
  }

  html, body {
    margin: 0;
    height: 100%;
    background: #0D0A5C;
    color: var(--ink);
    font-family: var(--sans);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  body { overflow: hidden; }
  a { color: var(--teal-ink); text-decoration-thickness: 1px; text-underline-offset: 5px; }

  /* ---- Deck: fixed 1600×900 slides, scaled to fit ---- */
  .deck { position: fixed; inset: 0; }
  .slide {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 1600px;
    height: 900px;
    margin: -450px 0 0 -800px;
    transform: scale(var(--scale, 1));
    display: none;
    background: var(--paper);
    overflow: hidden;
  }
  .slide.on { display: block; }
  .slide aside { display: none; }
  .canvas { position: absolute; left: 0; top: 0; display: block; width: 1600px; height: 900px; }

  /* ---- builds: [data-step] elements appear click by click, [data-until] ends them ---- */
  .step { opacity: 0; visibility: hidden; transition: opacity 0.35s, visibility 0.35s; }
  .step.on { opacity: 1; visibility: visible; }
  .anim .rise.on { animation: rise 0.45s ease-out both; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .anim .pop.on { transform-box: fill-box; transform-origin: center; animation: pop 0.4s cubic-bezier(0.2, 1.3, 0.3, 1) both; }
  @keyframes pop { from { opacity: 0; transform: scale(0.6); } to { opacity: 1; transform: none; } }
  .anim .grow.on { transform-box: fill-box; transform-origin: left center; animation: grow 0.9s cubic-bezier(0.3, 0.7, 0.2, 1) both; }
  @keyframes grow { from { transform: scaleX(0); } to { transform: none; } }
  .anim .growup.on { transform-box: fill-box; transform-origin: center bottom; animation: growup 0.7s cubic-bezier(0.3, 0.7, 0.2, 1) both; }
  @keyframes growup { from { transform: scaleY(0); } to { transform: none; } }
  .anim .lit.on rect { animation: lit 0.5s ease-out both; animation-delay: calc(var(--i) * 0.035s); }
  @keyframes lit { from { opacity: 0; } to { opacity: 1; } }

  /* speaker notes: press s */
  #notes {
    position: fixed;
    left: 2%;
    right: 2%;
    bottom: 2%;
    max-height: 42%;
    overflow: auto;
    padding: 14px 20px;
    border-radius: 10px;
    background: rgba(13, 10, 92, 0.95);
    color: #FAF7F3;
    font-size: 18px;
    line-height: 1.5;
    z-index: 5;
  }
  #notes[hidden] { display: none; }

  /* ---- static (?static) and print: every slide fully built ---- */
  .static *, .static *::before, .static *::after { transition: none !important; animation: none !important; }
  @page { size: 1600px 900px; margin: 0; }
  @media print {
    html, body { height: auto; overflow: visible; }
    .deck { position: static; }
    .slide { position: relative; left: auto; top: auto; margin: 0; transform: none !important; display: block !important; break-after: page; page-break-after: always; }
    .step { opacity: 1 !important; visibility: visible !important; }
    #notes { display: none !important; }
  }
</style>
</head>

<rect width="1600" height="900" fill="#FAF7F3"/>
<text x="120" y="176" font-family="Poppins" font-weight="800" font-size="54" fill="#06038D">Throwaway relays: the catch</text><rect x="120" y="268" width="440" height="260" rx="16" fill="#FFFFFF"/><rect x="120" y="268" width="440" height="8" fill="#C2186A"/><text x="152" y="340" font-family="Poppins" font-weight="800" font-size="32" fill="#06038D">The node still leaks</text><text x="152" y="394" font-family="Poppins" font-weight="500" font-size="22" fill="#36364C">Since Fulu its ENR shows</text><text x="152" y="432" font-family="Poppins" font-weight="500" font-size="22" fill="#36364C">its stake (cgc): StakeBleed</text><text x="152" y="470" font-family="Poppins" font-weight="500" font-size="22" fill="#36364C">can still find its prefix.</text><rect x="580" y="268" width="440" height="260" rx="16" fill="#FFFFFF"/><rect x="580" y="268" width="440" height="8" fill="#C2186A"/><text x="612" y="340" font-family="Poppins" font-weight="800" font-size="32" fill="#06038D">Relays are re-found</text><text x="612" y="394" font-family="Poppins" font-weight="500" font-size="22" fill="#36364C">A new relay’s first votes</text><text x="612" y="432" font-family="Poppins" font-weight="500" font-size="22" fill="#36364C">map it again. Each respawn</text><text x="612" y="470" font-family="Poppins" font-weight="500" font-size="22" fill="#36364C">costs missed votes.</text><rect x="1040" y="268" width="440" height="260" rx="16" fill="#FFFFFF"/><rect x="1040" y="268" width="440" height="8" fill="#C2186A"/><text x="1072" y="340" font-family="Poppins" font-weight="800" font-size="32" fill="#06038D">Proposals need more</text><text x="1072" y="394" font-family="Poppins" font-weight="500" font-size="22" fill="#36364C">A known relay can be DoSed</text><text x="1072" y="432" font-family="Poppins" font-weight="500" font-size="22" fill="#36364C">in your slot: use a fresh one.</text><text x="1072" y="470" font-family="Poppins" font-weight="500" font-size="22" fill="#36364C">Builder API calls leak too.</text><g data-step="1" class="rise"><rect x="120" y="556" width="440" height="260" rx="16" fill="#FFFFFF"/><rect x="120" y="556" width="440" height="8" fill="#FC8833"/><text x="152" y="628" font-family="Poppins" font-weight="800" font-size="32" fill="#06038D">Aggregators exposed</text><text x="152" y="682" font-family="Poppins" font-weight="500" font-size="22" fill="#36364C">Direct sending needs known,</text><text x="152" y="720" font-family="Poppins" font-weight="500" font-size="22" fill="#36364C">reachable aggregators, and</text><text x="152" y="758" font-family="Poppins" font-weight="500" font-size="22" fill="#36364C">128 copies of every vote.</text></g><g data-step="1" class="rise"><rect x="580" y="556" width="440" height="260" rx="16" fill="#FFFFFF"/><rect x="580" y="556" width="440" height="8" fill="#FC8833"/><text x="612" y="628" font-family="Poppins" font-weight="800" font-size="32" fill="#06038D">Who gets in?</text><text x="612" y="682" font-family="Poppins" font-weight="500" font-size="22" fill="#36364C">Fresh relays have no peer</text><text x="612" y="720" font-family="Poppins" font-weight="500" font-size="22" fill="#36364C">score: floods are cheap.</text><text x="612" y="758" font-family="Poppins" font-weight="500" font-size="22" fill="#36364C">Needs PoV or per-vote checks.</text></g><g data-step="1" class="rise"><rect x="1040" y="556" width="440" height="260" rx="16" fill="#FFFFFF"/><rect x="1040" y="556" width="440" height="8" fill="#FC8833"/><text x="1072" y="628" font-family="Poppins" font-weight="800" font-size="32" fill="#06038D">Trust and clouds</text><text x="1072" y="682" font-family="Poppins" font-weight="500" font-size="22" fill="#36364C">A shared relay sees, and can</text><text x="1072" y="720" font-family="Poppins" font-weight="500" font-size="22" fill="#36364C">drop, your votes. Cheap relays</text><text x="1072" y="758" font-family="Poppins" font-weight="500" font-size="22" fill="#36364C">crowd into a few clouds.</text></g><g data-step="2" class="rise"><text x="120" y="858" font-family="Poppins" font-weight="800" font-size="26" fill="#C2186A">“Partial protection is no protection.”</text><text x="780" y="858" font-family="Poppins" font-weight="500" font-size="16" fill="#6E6C80">ethresear.ch 21050, Nov 2024, on Builder API registrations</text></g>
</svg>

<section class="slide svg s-a-heur" aria-label="Our heuristic">
<svg class="canvas" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Our heuristic">

<text x="120" y="176" font-family="Poppins" font-weight="800" font-size="54" fill="#06038D">Our heuristic: v runs on p if</text><rect x="120" y="292" width="90" height="52" rx="26" fill="#07C3A6"/><text x="165" y="326.6" font-family="Poppins" font-weight="800" font-size="24" fill="#FFFFFF" text-anchor="middle">C1</text><text x="240" y="330" font-family="Poppins" font-weight="600" font-size="30" fill="#36364C">At least 90 % of the expected non-backbone votes of v arrive from peer p</text><rect x="120" y="402" width="90" height="52" rx="26" fill="#07C3A6"/><text x="165" y="436.6" font-family="Poppins" font-weight="800" font-size="24" fill="#FFFFFF" text-anchor="middle">C2</text><text x="240" y="440" font-family="Poppins" font-weight="600" font-size="30" fill="#36364C">p is not subscribed to all 64 subnets</text><rect x="120" y="512" width="90" height="52" rx="26" fill="#07C3A6"/><text x="165" y="546.6" font-family="Poppins" font-weight="800" font-size="24" fill="#FFFFFF" text-anchor="middle">C3</text><text x="240" y="550" font-family="Poppins" font-weight="600" font-size="30" fill="#36364C">We receive at least every tenth vote we expect for v from p</text><rect x="120" y="622" width="90" height="52" rx="26" fill="#07C3A6"/><text x="165" y="656.6" font-family="Poppins" font-weight="800" font-size="24" fill="#FFFFFF" text-anchor="middle">C4</text><text x="240" y="660" font-family="Poppins" font-weight="600" font-size="30" fill="#36364C">v’s vote count from p is one standard deviation above p’s mean per validator</text><text x="120" y="800" font-family="Poppins" font-weight="500" font-size="26" fill="#6E6C80">Conservative on purpose: we only label peers we saw long and well enough.</text><text x="120" y="860" font-family="Poppins" font-weight="500" font-size="16" fill="#6E6C80">Heimbach, Vonlanthen, Villacis, Kiffer, Wattenhofer, USENIX Security 2025, §4</text>
</svg>

<div id="notes" hidden></div>

<script>
(function () {
  "use strict";
  var params = new URLSearchParams(location.search);
  var STATIC = params.has("static") ||
    (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);

  function boot() {
    /* ---------------- embedded images ---------------- */
    Array.prototype.forEach.call(document.querySelectorAll("[data-a]"), function (el) {
      el.setAttribute("href", window.ASSETS[el.getAttribute("data-a")]);
    });

    /* ---------------- deck navigation ---------------- */
    var slides = Array.prototype.slice.call(document.querySelectorAll(".slide"));
    var N = slides.length;
    var cur = 0;
    var notes = document.getElementById("notes");

    function fit() {
      var k = Math.min(window.innerWidth / 1600, window.innerHeight / 900);
      document.documentElement.style.setProperty("--scale", k);
    }
    function showNotes() {
      var a = slides[cur].querySelector("aside");
      notes.textContent = a ? a.textContent : "";
    }
    function show(i, atEnd) {
      i = Math.max(0, Math.min(N - 1, i));
      slides[cur].classList.remove("on");
      cur = i;
      slides[cur].classList.add("on");
      if (location.hash !== "#" + (cur + 1)) history.replaceState(null, "", location.search + "#" + (cur + 1));
      BUILD.enter(cur, atEnd);
      showNotes();
    }
    // a click first plays the slide's next build step, then moves on; back lands on the previous slide fully built
    function next() { if (!BUILD.forward(cur) && cur < N - 1) show(cur + 1); }
    function prev() { if (!BUILD.back(cur) && cur > 0) show(cur - 1, true); }

    function fromHash() {
      var m = /^#(\d+)$/.exec(location.hash);
      return m ? parseInt(m[1], 10) - 1 : 0;
    }

    document.addEventListener("keydown", function (e) {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      var k = e.key;
      if (k === "ArrowRight" || k === "ArrowDown" || k === "PageDown" || k === " " || k === "Enter" || k === "n") { e.preventDefault(); next(); }
      else if (k === "ArrowLeft" || k === "ArrowUp" || k === "PageUp" || k === "Backspace" || k === "p") { e.preventDefault(); prev(); }
      else if (k === "Home") show(0);
      else if (k === "End") show(N - 1);
      else if (k === "s") notes.hidden = !notes.hidden;
      else if (k === "f") {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
        else document.exitFullscreen && document.exitFullscreen();
      }
    });
    document.addEventListener("click", function (e) {
      if (e.target.closest("a, button, #notes")) return;
      if (e.clientX < window.innerWidth * 0.25) prev(); else next();
    });
    var tx = null;
    document.addEventListener("touchstart", function (e) { tx = e.touches[0].clientX; }, { passive: true });
    document.addEventListener("touchend", function (e) {
      if (tx === null) return;
      var dx = e.changedTouches[0].clientX - tx;
      if (Math.abs(dx) > 50) { if (dx < 0) next(); else prev(); }
      tx = null;
    });
    window.addEventListener("resize", fit);
    window.addEventListener("hashchange", function () { show(fromHash()); });

    /* ---------------- builds: [data-step] elements appear click by click, [data-until] ends them ---------------- */
    var BUILD = (function () {
      var ALL = params.has("static");                    // stills and PDF exports show every slide fully built
      var builds = slides.map(function (s) {
        var els = Array.prototype.slice.call(s.querySelectorAll("[data-step]"));
        els.forEach(function (el) { el.classList.add("step"); });
        var n = els.reduce(function (m, el) { return Math.max(m, +el.getAttribute("data-step")); }, 0);
        return { els: els, n: n, at: 0 };
      });
      function apply(i) {
        var b = builds[i];
        b.els.forEach(function (el) {
          var from = +el.getAttribute("data-step"), until = el.getAttribute("data-until");
          el.classList.toggle("on", b.at >= from && (until === null || b.at <= +until));
        });
        for (var k = 1; k <= b.n; k++) slides[i].classList.toggle("at" + k, b.at >= k);
      }
      function allEnd() { builds.forEach(function (b, i) { b.at = b.n; apply(i); }); }
      window.addEventListener("beforeprint", allEnd);    // a PDF of the deck shows every slide fully built, whatever slide is open
      return {
        enter: function (i, atEnd) { var b = builds[i]; b.at = atEnd || ALL ? b.n : 0; apply(i); },
        forward: function (i) { var b = builds[i]; if (b.at >= b.n) return false; b.at++; apply(i); return true; },
        back: function (i) { var b = builds[i]; if (b.at <= 0) return false; b.at--; apply(i); return true; }
      };
    })();

    /* ---------------- boot ---------------- */
    if (params.has("static")) document.documentElement.classList.add("static");
    else if (!STATIC) document.documentElement.classList.add("anim");
    fit();
    cur = Math.max(0, Math.min(N - 1, fromHash()));
    slides[cur].classList.add("on");
    BUILD.enter(cur);
    showNotes();
  }
  document.addEventListener("DOMContentLoaded", boot);
})();
</script>
